name: data-refresh

on:
  schedule:
    # 21:00 UTC = 17:00 ET = 30 min after NYSE close (Mon-Fri)
    - cron: '0 21 * * 1-5'
    # 11:00 UTC = 07:00 ET = pre-market snapshot (Mon-Fri)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape quotes (nasdaq+cboe+cnbc)
        run: node scripts/scrape-quotes.mjs

      - name: Scrape news (Google News RSS)
        run: node scripts/scrape-news.mjs
        continue-on-error: true

      - name: Verify quotes (cross-source)
        run: node scripts/verify-quotes.mjs

      - name: Scrape fundamentals (cnbc+sec-xbrl+stockanalysis+nasdaq)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * 1-5'
        run: node scripts/scrape-fundamentals.mjs
        continue-on-error: true

      - name: Scrape yields (treasury+mof+eurostat)
        # Runs on BOTH weekday cron slots, unlike fundamentals above — each
        # source updates once daily at most, so the pre-market run simply
        # re-fetches yesterday's already-stored value and no-ops via the
        # upsert-by-date rule (a same-value re-write is a no-op diff).
        run: node scripts/scrape-yields.mjs
        continue-on-error: true

      - name: Validate JSON
        run: |
          # Recursive: data/history/ and any future subdirectory must be checked
          # too. A non-recursive data/*.json glob would pass while shipping a
          # corrupt data/history/yields-2026.json.
          find data -name '*.json' -print0 | while IFS= read -r -d '' f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" && echo "OK $f"
          done

      # validate.yml carries branches-ignore:[main], so nothing the bot writes to
      # main is covered by it. Without this the cron is the one writer no
      # integrity check ever sees — and it is the writer that produced the
      # duplicate news-feed id on 2026-08-24. Read-only; fails the run rather
      # than committing a feed that violates an invariant.
      - name: Data integrity (the bot is not exempt)
        run: node scripts/validate-data.mjs

      # The writer lives in scripts/commit-refresh.sh, not inline here. Every
      # attempt to test an inline block by pattern-matching this YAML was
      # bypassable — a regex cannot tell `git commit -m "..."` from
      # `git -c commit.gpgSign=false commit -am "..."`, cannot follow a line
      # continuation, and cannot say whether the guard it matched is the one
      # that runs. As a file it is executed end-to-end by
      # scripts/test/commit-refresh.test.mjs against a scratch repository.
      - name: Commit & push if changed
        run: bash scripts/commit-refresh.sh
