name: probe-sources

# Manual diagnostic only — dumps raw upstream payloads to the job log so source
# adapters can be grounded in real responses from a runner IP. Never commits.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe quote sources
        run: node scripts/probe-sources.mjs
